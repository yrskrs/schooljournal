# Funnel terminates HTTPS before forwarding to this local HTTP proxy.
map $http_x_forwarded_proto $funnel_forwarded_proto {
    default $scheme;
    https https;
}

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;

    # Обслуговування статичних файлів безпосередньо через Nginx
    location /static/ {
        alias /app/staticfiles/;
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Обслуговування завантажених медіафайлів
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Перенаправлення всіх інших запитів на Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $funnel_forwarded_proto;
        proxy_redirect off;
    }
}
