name: school-api-checks
x-db: &db
  image: postgres:16
  environment:
    POSTGRES_DB: checks
    POSTGRES_USER: checks
    POSTGRES_PASSWORD: synthetic-checks-only
  tmpfs: [/var/lib/postgresql/data]
  healthcheck:
    test: [CMD-SHELL, pg_isready -U checks -d checks]
    interval: 2s
    retries: 30
x-work-env: &work-env
  JOURNAL_API_BASE_URL: 'http://work:8000'
  SECRET_KEY: synthetic-work-integration-secret-for-tests-only
  DEBUG: 'False'
  DATABASE_URL: postgresql://checks:synthetic-checks-only@workdb:5432/checks
  DB_ENGINE: django.db.backends.postgresql
  POSTGRES_DB: checks
  POSTGRES_USER: checks
  POSTGRES_PASSWORD: synthetic-checks-only
  POSTGRES_HOST: workdb
  POSTGRES_PORT: '5432'
  ROSTER_SYNC_TOKEN: synthetic-work-roster-token
  ROSTER_SYNC_INTERVAL: '2'
  ROSTER_PEERS: '[{"url":"http://test:8000/api/v2/roster-sync/","token":"synthetic-test-roster-token"},{"url":"http://journal:8000/api/v2/roster-sync/","token":"synthetic-journal-roster-token"}]'
  AI_JOBS_EAGER: 'False'
services:
  testdb: *db
  workdb: *db
  journaldb: *db
  test:
    networks:
      default:
        ipv4_address: ${CHECK_TEST_IP:-10.253.141.10}
    image: schooltest5-app:1.5.0
    environment:
      SECRET_KEY: synthetic-test-integration-secret
      DATABASE_URL: postgresql://checks:synthetic-checks-only@testdb:5432/checks
      DEBUG: 'False'
      JOURNAL_API_BASE_URL: 'http://test:8000'
      ROSTER_SYNC_TOKEN: synthetic-test-roster-token
      ROSTER_SYNC_INTERVAL: '2'
      ROSTER_PEERS: '[{"url":"http://work:8000/api/v2/roster-sync/","token":"synthetic-work-roster-token"},{"url":"http://journal:8000/api/v2/roster-sync/","token":"synthetic-journal-roster-token"}]'
    depends_on:
      testdb: {condition: service_healthy}
    ports: ['127.0.0.1:19080:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 2s
      retries: 30
  work:
    networks:
      default:
        ipv4_address: ${CHECK_WORK_IP:-10.253.141.11}
    image: schoolwork2-app:4.4.0
    environment: *work-env
    depends_on:
      workdb: {condition: service_healthy}
    ports: ['127.0.0.1:19000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/teacher/login/',timeout=5)"]
      interval: 2s
      retries: 30
      start_period: 20s
  worker:
    image: schoolwork2-app:4.4.0
    environment: *work-env
    command: [python, manage.py, process_ai_jobs]
    depends_on:
      work: {condition: service_healthy}
  journal:
    networks:
      default:
        ipv4_address: ${CHECK_JOURNAL_IP:-10.253.141.12}
    image: schooljournal-web:1.3.0
    environment:
      SECRET_KEY: synthetic-journal-integration-secret
      ALLOWED_HOSTS: 'journal,localhost,127.0.0.1'
      INITIAL_SETUP_ENABLED: 'False'
      SEED_DEMO_DATA: 'False'
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: checks
      POSTGRES_USER: checks
      POSTGRES_PASSWORD: synthetic-checks-only
      POSTGRES_HOST: journaldb
      POSTGRES_PORT: '5432'
      ROSTER_SYNC_TOKEN: synthetic-journal-roster-token
      ROSTER_SYNC_INTERVAL: '2'
      ROSTER_SCHOOL_ID: '1'
      ROSTER_YEAR_ID: '1'
      ROSTER_PEERS: '[{"url":"http://test:8000/api/v2/roster-sync/","token":"synthetic-test-roster-token"},{"url":"http://work:8000/api/v2/roster-sync/","token":"synthetic-work-roster-token"}]'
    depends_on:
      journaldb: {condition: service_healthy}
    ports: ['127.0.0.1:19085:8000']
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://localhost:8000/healthz/']
      interval: 2s
      retries: 30
      start_period: 20s

# Dedicated synthetic-only subnet; stable source IPs survive container recreation.
networks:
  default:
    ipam:
      config:
        - subnet: ${CHECK_SUBNET:-10.253.141.0/24}
