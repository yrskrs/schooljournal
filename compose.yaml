name: ${COMPOSE_PROJECT_NAME:-schooljournal}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schooljournal_db}
      POSTGRES_USER: ${POSTGRES_USER:-journal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journal_user} -d ${POSTGRES_DB:-schooljournal_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [journal_net]
  web:
    image: ${JOURNAL_IMAGE:-schooljournal-web:1.3.22}
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
    restart: unless-stopped
    env_file:
      - "${ENV_FILE:-.env}"
    environment:
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-schooljournal_db}
      POSTGRES_USER: ${POSTGRES_USER:-journal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Run setup.sh to generate SECRET_KEY}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - backups_data:/app/backups
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/healthz/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [journal_net]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8085}:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz/"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [journal_net]
  updater:
    image: ${UPDATER_IMAGE:-schooljournal-updater:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.updater
    restart: unless-stopped
    environment:
      JOURNAL_ROOT: /workspace
      ENV_FILE: /workspace/.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-schooljournal}
      UPDATER_PORT: 8001
      GITHUB_REPO: yrskrs/schooljournal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - backups_data:/workspace/backups
    networks: [journal_net]
volumes:
  postgres_data:
  static_data:
  media_data:
  backups_data:
networks:
  journal_net:
